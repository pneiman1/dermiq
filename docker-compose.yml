services:
  postgres:
    image: postgres:16-alpine
    container_name: dermiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: del_mar_source
      POSTGRES_USER: dermiq
      POSTGRES_PASSWORD: dermiq_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dermiq -d del_mar_source"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
