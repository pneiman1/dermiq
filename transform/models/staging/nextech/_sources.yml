version: 2

sources:
  - name: nextech
    description: >
      Faithful raw copy of the Nextech-shaped source EMR, landed by the ingestion
      job into RAW_<TENANT>. Column names are uppercased; tz-aware timestamps are
      TIMESTAMP_TZ. Two lineage columns are added at load time: _ingested_at and
      _source_table.
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'DERMIQ_DEV') }}"
    schema: "RAW_{{ env_var('DEFAULT_TENANT_ID', 'del_mar') | upper }}"
    config:
      # Stamped once per ingestion run on every row; drives source freshness.
      loaded_at_field: _ingested_at
    tables:
      - name: providers
        description: One row per clinician/provider at the practice.
        columns:
          # Contract guard (ADR-005): these columns are sparse/all-NULL in the
          # source, so they are exactly the ones that silently mis-type if
          # ingestion regresses to pandas inference. error severity = hard fail.
          - name: npi_number
            data_tests:
              - source_column_data_type:
                  arguments:
                    expected_type: VARCHAR
                  config:
                    severity: error
          - name: hire_date
            data_tests:
              - source_column_data_type:
                  arguments:
                    expected_type: DATE
                  config:
                    severity: error
          - name: termination_date
            data_tests:
              - source_column_data_type:
                  arguments:
                    expected_type: DATE
                  config:
                    severity: error
      - name: services
        description: Service/procedure catalog with default price and cost.
      - name: patients
        description: One row per patient; soft-deleted via deleted_at.
      - name: appointments
        description: Scheduled visits with status and actual arrival/departure.
      - name: transactions
        description: Line-item revenue events tied to patient, provider, service.
      - name: inventory_units
        description: >
          Consumable product master (chunk-11): one row per service consumable
          with its real per-unit acquisition cost.
      - name: inventory_transactions
        description: >
          Consumption events (chunk-11): product units burned to deliver each
          sales transaction, with quantity, unit_cost and transaction_value.
