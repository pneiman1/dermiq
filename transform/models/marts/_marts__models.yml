version: 2

models:
  - name: mart_revenue_daily
    description: One row per calendar day — revenue, category split, volume, funnel.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "net_revenue >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "no_show_rate between 0 and 1"
    columns:
      - name: date_day
        description: Grain — calendar day.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

  - name: mart_provider_scorecard
    description: One row per provider — TTM-primary performance with all-time context.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "revenue_ttm >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cross_sell_rate_ttm between 0 and 1"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "skincare_attach_rate_ttm between 0 and 1"
    columns:
      - name: provider_id
        description: Grain — provider.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

  - name: mart_channel_attribution
    description: One row per acquisition channel — TTM cohort economics, spend, CAC, LTV:CAC.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "patients_acquired_ttm >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "spend_ttm >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "cac_ttm >= 0"
    columns:
      - name: acquisition_channel
        description: Grain — acquisition channel.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: channel_health
        description: organic / excellent / healthy / marginal / unprofitable.
        data_tests:
          - accepted_values:
              arguments:
                values: ["organic", "excellent", "healthy", "marginal", "unprofitable"]
              config:
                severity: warn

  - name: mart_true_margin_by_service
    description: One row per consumable service — TTM true margin from real cost-of-goods.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "revenue_ttm >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "consumables_cost_ttm >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "true_margin_ttm = revenue_ttm - consumables_cost_ttm"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "true_margin_pct <= 1"
    columns:
      - name: service_code
        description: Grain — consumable service.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: service_category
        description: Service category (consumable categories only).
        data_tests:
          - accepted_values:
              arguments:
                values: ["injectable", "energy_device", "skincare_retail"]
              config:
                severity: warn

  - name: mart_inventory_status
    description: One row per SKU — on-hand stock, par level, days of supply, status.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "on_hand_quantity >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "on_hand_value >= 0"
    columns:
      - name: sku
        description: Grain — inventory SKU.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: stock_status
        description: out / low / adequate / overstock.
        data_tests:
          - accepted_values:
              arguments:
                values: ["out", "low", "adequate", "overstock"]
              config:
                severity: warn

  - name: mart_expiring_soon
    description: One row per on-hand lot with a future expiry — days to expiry, quantity, value at risk.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "quantity_remaining > 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "estimated_value_at_risk >= 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "days_to_expiry >= 0"
    columns:
      - name: lot_id
        description: Grain — inventory lot.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: urgency_level
        description: critical / warning / watch / future.
        data_tests:
          - accepted_values:
              arguments:
                values: ["critical", "warning", "watch", "future"]
              config:
                severity: warn

  - name: mart_recall_queue
    description: One row per lapsing/lapsed patient to recall, with contact, last provider, and priority.
    columns:
      - name: patient_id
        description: Grain — patient.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: recency_tier
        description: Restricted to lapsing/lapsed by the recall filter.
        data_tests:
          - accepted_values:
              arguments:
                values: ["lapsing", "lapsed"]
              config:
                severity: warn
      - name: ltv_tier
        description: vip / high / standard / low (never-visited excluded by filter).
        data_tests:
          - accepted_values:
              arguments:
                values: ["vip", "high", "standard", "low"]
              config:
                severity: warn
      - name: recall_priority
        description: urgent / high / medium / low.
        data_tests:
          - accepted_values:
              arguments:
                values: ["urgent", "high", "medium", "low"]
              config:
                severity: warn

  - name: mart_patient_segments
    description: One row per discovered k-means patient segment.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "patient_count > 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "avg_ltv >= 0"
    columns:
      - name: cluster_id
        description: Grain — k-means cluster id.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

  - name: mart_patient_segment_members
    description: One row per clustered patient (drill-in behind each segment).
    columns:
      - name: patient_id
        description: Grain — patient.
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: cluster_id
        description: FK to mart_patient_segments.
        data_tests:
          - relationships:
              arguments:
                to: ref('mart_patient_segments')
                field: cluster_id
              config:
                severity: error
