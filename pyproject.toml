[project]
name = "dermiq"
version = "0.1.0"
description = "Analytics intelligence platform for cosmetic dermatology practices"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Phil Neiman" }]

dependencies = [
    "faker>=24.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "black>=24.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dermiq*"]
exclude = ["tests*", ".venv*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100